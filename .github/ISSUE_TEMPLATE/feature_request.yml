name: Feature request
description: An idea that would make the client better
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should the app do and what problem does it solve? Describe how you would use it.
      placeholder: I want the app to be able to ... because ...
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: Is there a way to get this today, in this or another client?
    validations:
      required: false
