name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: dnf install -y cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel openssl-devel libsecret-devel rpm-build systemd-rpm-macros rpmdevtools
      - name: Sources
        run: |
          VERSION=$(sed -n 's/^project(superpupervpn VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p ~/rpmbuild/SOURCES
          tar --exclude=.git --transform "s,^\.,superpupervpn-$VERSION," -czf ~/rpmbuild/SOURCES/superpupervpn-$VERSION.tar.gz .
          spectool -g -C ~/rpmbuild/SOURCES packaging/linux/superpupervpn.spec
      - name: Build, test, package
        run: |
          rpmbuild -bb packaging/linux/superpupervpn.spec
          if rpm -qp --requires ~/rpmbuild/RPMS/x86_64/superpupervpn-[0-9]*.rpm | grep PRIVATE_API; then
            echo "package depends on private Qt API" && exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ~/rpmbuild/RPMS/x86_64/superpupervpn-[0-9]*.rpm

  linux-install:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44', '45']
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Install and start
        run: |
          dnf install -y ./superpupervpn-*.rpm
          rc=0
          QT_QPA_PLATFORM=offscreen timeout 10 superpupervpn || rc=$?
          [ "$rc" = 124 ] || { echo "superpupervpn exited with $rc"; exit 1; }

  deb:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, package
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates dpkg-dev
          cp -r packaging/debian debian
          apt-get build-dep -y .
          VERSION=$(sed -n 's/^project(superpupervpn VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ "$(dpkg-parsechangelog -S Version)" = "$VERSION-1" ] || { echo "bump packaging/debian/changelog to $VERSION-1"; exit 1; }
          . ./core.lock
          curl -fsSLO "https://github.com/MetaCubeX/mihomo/releases/download/$MIHOMO_VERSION/$MIHOMO_LINUX"
          dpkg-buildpackage -b -us -uc
          mv ../superpupervpn_*.deb .
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: superpupervpn_*_amd64.deb

  deb-install:
    needs: deb
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:13', 'ubuntu:26.04']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
      - name: Install and start
        run: |
          apt-get update
          apt-get install -y ./superpupervpn_*.deb
          grep -q "$(sha256sum /usr/libexec/superpupervpn/mihomo | cut -c1-64)" /usr/libexec/superpupervpn/superpupervpn-helper || { echo "core hash is not the pinned one"; exit 1; }
          rc=0
          QT_QPA_PLATFORM=offscreen timeout 10 superpupervpn || rc=$?
          [ "$rc" = 124 ] || { echo "superpupervpn exited with $rc"; exit 1; }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Version, OpenSSL, core
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^project\(superpupervpn VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV
          $crypto = Get-ChildItem 'C:\Program Files\OpenSSL*' -Recurse -Filter libcrypto-3-x64.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $crypto) {
            choco install openssl --no-progress -y
            $crypto = Get-ChildItem 'C:\Program Files\OpenSSL*' -Recurse -Filter libcrypto-3-x64.dll | Select-Object -First 1
          }
          "OPENSSL_DLL=$($crypto.FullName)" >> $env:GITHUB_ENV
          "OPENSSL_ROOT=$((Get-Item $crypto.DirectoryName).Parent.FullName)" >> $env:GITHUB_ENV
          $lock = Get-Content core.lock -Raw | ConvertFrom-StringData
          $zip = $lock.MIHOMO_WINDOWS.Trim()
          $url = "https://github.com/MetaCubeX/mihomo/releases/download/$($lock.MIHOMO_VERSION.Trim())/$zip"
          Invoke-WebRequest $url -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $want = $lock.MIHOMO_WINDOWS_SHA256.Trim().ToLower()
          Write-Host "url=$url size=$((Get-Item $zip).Length) got=$got want=$want"
          if ($got -ne $want) { throw "core archive hash mismatch" }
          Expand-Archive $zip -DestinationPath core-x
          $exe = Get-ChildItem core-x -Filter *.exe | Select-Object -First 1
          New-Item -ItemType Directory deploy/core -Force | Out-Null
          Copy-Item $exe.FullName deploy/core/mihomo.exe
          "CORE_SHA256=$((Get-FileHash deploy/core/mihomo.exe -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_ENV
      - name: Build and test
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSUPERPUPERVPN_CORE_SHA256=%CORE_SHA256% "-DOPENSSL_ROOT_DIR=%OPENSSL_ROOT%" || exit /b 1
          cmake --build build -- -k 0 || exit /b 1
          ctest --test-dir build --output-on-failure || exit /b 1
      - name: Package
        shell: pwsh
        run: |
          foreach ($name in 'superpupervpn.exe', 'superpupervpn-helper.exe') {
            $exe = Get-ChildItem build -Recurse -Filter $name | Select-Object -First 1
            if (-not $exe) { throw "$name not found" }
            Copy-Item $exe.FullName deploy/
          }
          windeployqt --release --qmldir src/gui/qml deploy/superpupervpn.exe
          windeployqt --release deploy/superpupervpn-helper.exe
          New-Item -ItemType Directory deploy/imageformats, deploy/iconengines -Force | Out-Null
          Copy-Item "$env:QT_ROOT_DIR/bin/Qt6Svg.dll" deploy/
          Copy-Item "$env:QT_ROOT_DIR/plugins/imageformats/qsvg.dll" deploy/imageformats/
          Copy-Item "$env:QT_ROOT_DIR/plugins/iconengines/qsvgicon.dll" deploy/iconengines/
          Copy-Item $env:OPENSSL_DLL deploy/
          Get-ChildItem "$env:VCToolsRedistDir/x64/Microsoft.VC*.CRT/*.dll" | Copy-Item -Destination deploy/
          Copy-Item licenses deploy/licenses -Recurse
          dotnet tool install --global wix --version 5.0.2
          $deployDir = (Resolve-Path deploy).Path
          wix build packaging/windows/superpupervpn.wxs -arch x64 -d Version=$env:VERSION -d "Deploy=$deployDir" -o "SuperPuperVPN-$env:VERSION-windows-x64.msi"
          if ((Get-Item "SuperPuperVPN-$env:VERSION-windows-x64.msi").Length -lt 10MB) { throw "MSI is suspiciously small" }
          Compress-Archive -Path deploy/* -DestinationPath "SuperPuperVPN-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            SuperPuperVPN-*-windows-x64.msi
            SuperPuperVPN-*-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-install, deb, deb-install, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "SuperPuperVPN $GITHUB_REF_NAME" --generate-notes
