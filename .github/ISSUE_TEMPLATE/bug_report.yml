name: Bug report
description: Something does not work in SuperPuperVPN
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make SuperPuperVPN better!
        The more detailed the report, the faster the fix.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version number from Settings → About («Настройки» → «О программе»)
      placeholder: e.g. 0.4.2
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Fedora
        - Ubuntu
        - Debian
        - Linux Mint
        - Other (please specify in the description)
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - System proxy
        - TUN
        - Not connection-related
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. Steps to reproduce.
      placeholder: |
        1. Opened the app
        2. Pasted a vless://... link
        3. Pressed connect and got the error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        In the app: Logs → Export («Логи» → «Экспорт»). The exported log has server addresses
        and keys masked. Attach the file or paste its contents here.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the Troubleshooting table in the README and my problem is not there
        - label: The logs come from the Export button (personal data in them is masked)
